<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.intro"></p>
</header>

<div class="homey-form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="alfen-host" data-i18n="pair.host"></label>
    <input class="homey-form-input" id="alfen-host" type="text" placeholder="192.168.1.50" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="alfen-port" data-i18n="pair.port"></label>
    <input class="homey-form-input" id="alfen-port" type="number" value="502" min="1" max="65535" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="alfen-unit" data-i18n="pair.unit_id"></label>
    <select class="homey-form-select" id="alfen-unit">
      <option value="1">1</option>
      <option value="2">2</option>
    </select>
  </div>
  <button class="homey-button-primary-full" id="alfen-connect" type="button" data-i18n="pair.connect"></button>
  <p id="alfen-status" style="margin-top: 1em;"></p>
</div>

<script type="application/javascript">
  (function () {
    var button = document.getElementById('alfen-connect');
    var status = document.getElementById('alfen-status');

    function done() {
      button.classList.remove('is-loading');
      button.disabled = false;
    }

    function fail(err) {
      var message = (err && err.message) || String(err);
      status.textContent = message;
      done();
      Homey.alert(message);
    }

    button.addEventListener('click', function () {
      button.classList.add('is-loading');
      button.disabled = true;
      status.textContent = Homey.__('pair.connecting');

      Homey.emit('connect', {
        host:   document.getElementById('alfen-host').value,
        port:   document.getElementById('alfen-port').value,
        unitId: document.getElementById('alfen-unit').value,
      })
        .then(function () {
          done();
          Homey.showView('list_devices');
        })
        .catch(fail);
    });
  })();
</script>
