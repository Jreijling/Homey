<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anker Solix Settings</title>

  <script src="/homey.js"></script>
  <script>
    function onHomeyReady(Homey) {
      Homey.ready();

      function init() {
        var $ = function(id) { return document.getElementById(id); };

        function showStatus(el, msg, ok) {
          el.textContent = msg;
          el.style.color = ok ? '#388e3c' : '#c62828';
          el.style.display = 'block';
        }

        $('saveBtn').addEventListener('click', function() {
          var email    = $('email').value.trim();
          var password = $('password').value;
          var country  = ($('country').value.trim().toUpperCase()) || 'NL';
          if (!email || !password) {
            showStatus($('status'), 'Email and password are required.', false);
            return;
          }
          Promise.all([
            Homey.set('email',    email),
            Homey.set('password', password),
            Homey.set('country',  country),
          ]).then(function() {
            showStatus($('status'), 'Saved! App will reconnect.', true);
          }).catch(function(e) {
            showStatus($('status'), String(e), false);
          });
        });

        $('savePollBtn').addEventListener('click', function() {
          var interval = Math.max(30, parseInt($('poll_interval').value) || 60);
          $('poll_interval').value = interval;
          Homey.set('poll_interval', interval)
            .then(function() { showStatus($('pollStatus'), 'Saved!', true); })
            .catch(function(e) { showStatus($('pollStatus'), String(e), false); });
        });

        if (typeof Homey.get === 'function') {
          Homey.get('email').then(function(v) { $('email').value = v || ''; }).catch(function(){});
          Homey.get('country').then(function(v) { $('country').value = (v || 'NL').toUpperCase(); }).catch(function(){});
          Homey.get('poll_interval').then(function(v) { $('poll_interval').value = v || 60; }).catch(function(){});
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; background: #f5f5f5; color: #333; padding: 20px; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #111; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 500; margin-bottom: 4px; color: #555; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border-color .2s; }
    input:focus { outline: none; border-color: #00a0e3; }
    .hint { font-size: 12px; color: #888; margin-top: 3px; }
    button { background: #00a0e3; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: background .2s; }
    button:hover  { background: #0088c7; }
    button:active { background: #006fa3; }
    .status { margin-top: 8px; font-size: 13px; display: none; }
    hr { border: none; border-top: 1px solid #eee; margin: 8px 0 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Account credentials</h2>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="user@example.com" autocomplete="username">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <div class="field">
    <label for="country">Country code</label>
    <input id="country" type="text" placeholder="NL" maxlength="2" style="text-transform:uppercase">
    <p class="hint">2-letter ISO code: NL, DE, BE, FR, US, AU, … Used to select the correct API server.</p>
  </div>
  <hr>
  <button id="saveBtn">Save &amp; connect</button>
  <div class="status" id="status"></div>
</div>

<div class="card">
  <h2>Polling</h2>
  <div class="field">
    <label for="poll_interval">Poll interval (seconds)</label>
    <input id="poll_interval" type="number" min="30" max="3600" step="10" value="60">
    <p class="hint">How often to fetch data from the Anker cloud (minimum 30 s).</p>
  </div>
  <button id="savePollBtn">Save</button>
  <div class="status" id="pollStatus"></div>
</div>

</body>
</html>
