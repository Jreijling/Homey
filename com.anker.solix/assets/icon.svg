<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solar panel (stylised) -->
  <rect x="10" y="10" width="80" height="50" rx="4" fill="#1a237e"/>
  <!-- Panel grid -->
  <line x1="36" y1="10" x2="36" y2="60" stroke="#3949ab" stroke-width="2"/>
  <line x1="62" y1="10" x2="62" y2="60" stroke="#3949ab" stroke-width="2"/>
  <line x1="10" y1="27" x2="90" y2="27" stroke="#3949ab" stroke-width="2"/>
  <line x1="10" y1="44" x2="90" y2="44" stroke="#3949ab" stroke-width="2"/>
  <!-- Solar shine -->
  <circle cx="50" cy="35" r="8" fill="#ffd600" opacity="0.9"/>
  <!-- Stand -->
  <rect x="44" y="60" width="12" height="14" fill="#757575"/>
  <rect x="30" y="73" width="40" height="5" rx="2" fill="#757575"/>
  <!-- Battery indicator at bottom -->
  <rect x="20" y="83" width="60" height="12" rx="3" fill="#e3f2fd"/>
  <rect x="22" y="85" width="40" height="8"  rx="2" fill="#00acc1"/>
  <rect x="80" y="86" width="3"  height="6"  rx="1" fill="#90a4ae"/>
</svg>
